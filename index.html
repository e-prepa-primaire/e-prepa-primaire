<header><h1>e-Prepa Primaire</h1><p>CP1 CP2 CE1 CE2 CM1 CM2 - Modèle Burkina</p></header>
<div class="wrap"><div class="top no-print" id="classes"></div><div id="rubriques" class="no-print"></div><div id="content"></div></div>
<script>
const classes=["CP1","CP2","CE1","CE2","CM1","CM2"];
const mois=["Octobre","Novembre","Décembre","Janvier","Février","Mars","Avril","Mai"];
const L="LANGUE ET COMMUNICATION",M="MATHEMATIQUES SCIENCES ET TECHNOLOGIE",S="SCIENCES HUMAINES ET SOCIALES",E="EDUCATION PHYSIQUE ET SPORTIVE, ART, CULTURE ET PRODUCTION";
const rep={

CP2:[[L,"Expression orale"],[L,"Lecture"],[L,"Ecriture"],[M,"Mathématiques"],[M,"Exercices sensoriels"],[M,"TICE"],[S,"ECP"],[E,"Education Physique et Sportive"],[E,"Art et Culture"],[E,"Activités Pratiques de Productions"]],
CE1:[[L,"Expression orale"],[L,"Expression écrite"],[L,"Lecture"],[L,"Anglais"],[L,"Ecriture"],[L,"Vocabulaire"],[L,"Grammaire"],[L,"Conjugaison"],[L,"Orthographe"],[M,"Arithmétique"],[M,"Système Métrique"],[M,"Géométrie"],[M,"Exercices d'observation"],[M,"TICE"],[S,"ECP"],[S,"Histoire"],[S,"Géographie"],[E,"Education Physique et Sportive"],[E,"Art et Culture"],[E,"Activités Pratiques de Productions"]],
CE2:[[L,"Expression orale"],[L,"Expression orale"],[L,"Expression écrite"],[L,"Lecture"],[L,"Anglais"],[L,"Ecriture"],[L,"Vocabulaire usuel"],[L,"Grammaire"],[L,"Conjugaison"],[L,"Orthographe"],[M,"Arithmétique"],[M,"Système Métrique"],[M,"Géométrie"],[M,"Exercices d'observation"],[M,"TICE"],[S,"ECP"],[S,"Histoire"],[S,"Géographie"],[E,"Animation Sportive"],[E,"Art et Culture"],[E,"Activités Pratiques de Productions"]],
CM1:[[L,"Expression orale"],[L,"Expression orale"],[L,"Expression écrite"],[L,"Lecture"],[L,"Anglais"],[L,"Ecriture"],[L,"Vocabulaire usuel"],[L,"Vocabulaire théorique"],[L,"Grammaire"],[L,"Conjugaison"],[L,"Orthographe"],[M,"Arithmétique"],[M,"Système Métrique"],[M,"Géométrie"],[M,"Exercices d'observation"],[M,"TICE"],[S,"ECP"],[S,"Histoire"],[S,"Géographie"],[E,"Animation Sportive"],[E,"Art et Culture"],[E,"Activités Pratiques de Productions"]],
CM2:[[L,"Expression orale"],[L,"Expression orale"],[L,"Expression écrite"],[L,"Lecture"],[L,"Anglais"],[L,"Ecriture"],[L,"Vocabulaire usuel"],[L,"Vocabulaire théorique"],[L,"Grammaire"],[L,"Conjugaison"],[L,"Orthographe"],[M,"Arithmétique"],[M,"Système Métrique"],[M,"Géométrie"],[M,"Exercices d'observation"],[M,"TICE"],[S,"ECP"],[S,"Histoire"],[S,"Géographie"],[E,"Animation Sportive"],[E,"Art et Culture"],[E,"Activités Pratiques de Productions"]]
};
// EMPLOI DU TEMPS CP1 - INTEGRE TEL QUEL DEPUIS LE FICHIER WORD
const emplois={
CP1:{
titre:"EMPLOI DU TEMPS DES CLASSES DE 1re ANNÉE DE LA FORMULE HARMONISÉE - L'ÉDUCATION BIPLURILINGUE",
main:[
["7h30-8h","30 min","A.P.E L1&L2","ECP","Théâtre/Art culinaire/Danse/Musique/Conte/proverbes (L1)","ECP (L1-L2)","A.P.E (L1&L2)"],
["8h-8h15","15 min","A.P.E L1&L2","Causerie-débats (Démarche-NC)","Nouvelles de la classe (L1)","Expression orale (L2)","A.P.E (L1&L2)"],
["8h15-8h30","15 min","Nouvelles de la classe (L1)","Causerie-débats (Démarche-NC)","Nouvelles de la classe (L1)","Expression orale (L2)","Expression orale (L2)"],
["8h30-8h45","15 min","Nouvelles de la classe (L1)","Expression orale (L2)","Lecture guidée (L1)","Nouvelles de la classe (L1)","Expression orale (L2)"],
["8h45-9h","15 min","Expression orale (L2)","Expression orale (L2)","Lecture guidée (L1)","Nouvelles de la classe (L1)","Lecture guidée (L1)"],
["9h-9h15","15 min","Expression orale (L2)","Lecture guidée (L1)","TIC (L2)","Lecture guidée (L1)","Lecture guidée (L1)"],
["9h15-9h30","15 min","Lecture guidée (L1)","Lecture guidée (L1)","TIC (L2)","Lecture guidée (L1)","Écriture guidée (L1)"],
["9h30-9h45","15 min","Lecture guidée (L1)","Écriture guidée (L1)","Mathématiques révi (L1)","Écriture guidée (L1)","Écriture guidée (L1)"],
["9h45-10h","15 min","Écriture (L1)","Écriture guidée (L1)","Mathématiques révi (L1)","Écriture guidée (L1)","Lecture guidée (EI) L1"],
["10h-10h30","","","","RECREATION","",""],
["10h30-10h45","15 min","Expression orale (L2)","Expression orale (L2)","APP/Métiers","Expression orale (L2)","Expression orale (L2)"],
["10h45-11h","15 min","Expression orale (L2)","Expression orale (L2)","APP/Métiers","Expression orale (L2)","Expression orale (L2)"],
["11h-11h30","30 min","Mathématiques (L1)","Mathématiques (L1)","Écriture (L1)","Mathématiques (L1)","Mathématiques (L1)"],
["11h30-12h","30 min","Écriture guidée (L1)","Lecture guidée (L1)","","Écriture (L1)","Lecture guidée (L1)"],
["12h-15h","3h","","","INTER-CLASSE","",""],
["15h-15h30","30 min","Expression orale (L2)","Expression orale (L2)","RAS","Expression orale (L2)","Expression orale (L2)"],
["15h30-16h","30 min","Lecture guidée (L1)","Écriture guidée (L1)","RAS","Lecture guidée (L1)","Écriture guidée (L1)"],
["16h-16h30","30 min","Écriture guidée (L1)","Mathématiques (L1)","RAS","Exercices sensoriels (L2)","Exo. Mathématiques (L1)"],
["16h30-17h","30 min","Exercices sensoriels (L2)","Récitation (L1)","RAS","Dessin","Chant (L1)"]
],
recap:[
["A.P.E.","1 h 30","1h30","00"],
["E.C.P","1 h","1h","00"],
["Causerie débats","30 min","30 min","00"],
["Expression orale","6 h 30 min","6 h","- 30 min"],
["Nouvelles de la classe","1 h 30 min","1 h 30 min","00"],
["Lecture guidée","5 h 30","4 h 45 min","- 45 min"],
["Écriture guidée","2 h","3 h 30 min","+ 1 h 30"],
["Écriture","1 h","1 h 15 min","+ 15 min"],
["Mathématiques","4 h","3 h 30 min","- 30 min"],
["Exercices sensoriels","1 h","1 h","00"],
["TIC","30 min","30 min","00"],
["Chant","30 min","30 min","00"],
["Dessin","30 min","30 min","00"],
["Récitation","30 min","30 min","00"],
["Contes et proverbes","30 min","30 min","00"],
["A.P.P/Métiers","30 min","30 min","00"],
["Récréation","2 h 30 min","2 h 30 min","00"],
["Total","30h","30 h","00"]
]
}
};
const rubs=[{id:"repartition",t:"1. Répartition mensuelle"},{id:"emploi",t:"2. Emploi du temps"},{id:"cahier",t:"3. Cahier de préparation"},{id:"liste",t:"4. Liste alphabétique des élèves"},{id:"plan",t:"5. Plan d'amélioration individuel"}];
let curCls="CP1",curRub="repartition";
function key(){return "eprepa4_"+curCls+"_"+curRub}
function load(){try{return JSON.parse(localStorage.getItem(key()))||[]}catch(e){return[]}}
function save(){let d=[];document.querySelectorAll("#content input, #content textarea").forEach(i=>d.push(i.value));localStorage.setItem(key(),JSON.stringify(d));alert("Enregistré ! ✅")}
function setCls(c){curCls=c;renderClasses();renderRubs();renderContent()}
function renderClasses(){document.getElementById("classes").innerHTML=classes.map(c=>`<button class="btn cls ${c==curCls?"active":""}" onclick="setCls('${c}')">${c}</button>`).join("")}
function renderRubs(){document.getElementById("rubriques").innerHTML=`<h3>${curCls} - Choisis une rubrique :</h3>`+rubs.map(r=>`<button class="btn rub" onclick="setRub('${r.id}')">${r.t}</button>`).join("")}
function setRub(id){curRub=id;renderContent()}
function groupRow(idx,clsName,firstLabel){
let cols=rep[curCls];let html=`<th>${firstLabel}</th>`;let i=0;
while(i<cols.length){let j=i;while(j<cols.length&&cols[j][idx]==cols[i][idx])j++;let span=j-i;html+=`<th colspan="${span}" class="${clsName}">${cols[i][idx]}</th>`;i=j;}
return `<tr>${html}</tr>`;
}
function renderContent(){
let data=load();
if(curRub=="repartition"){
let cols=rep[curCls];
let isSplit=curCls!="CP1"&&curCls!="CP2";
let head=groupRow(0,"champ","CHAMPS DISCIPLINAIRES")+`<tr><th>Disciplines / Mensualités</th>`+cols.map(c=>`<th class="disc">${c[1]}</th>`).join("")+`</tr>`;
let rows="";
mois.forEach((m,i)=>{
let cells=`<td class="mois">${m}</td>`;
cols.forEach((c,j)=>{
let v=data[i]&&data[i][j]?data[i][j]:"";
if(isSplit&&c[1]=="Expression écrite")v="INITIATION A LA PRODUCTION ECRITE A PARTIR DES THEMES DE LA LECTURE ET DES STRUCTURES ETUDIEES EN EXPRESSION ORALE";
if(isSplit&&(c[1]=="Vocabulaire"||c[1]=="Vocabulaire usuel"))v="EN RAPPORT AVEC LES THÈMES DE LECTURE";
if(data[i]&&data[i][j])v=data[i][j];
cells+=`<td><textarea rows="3">${v}</textarea></td>`;
});
rows+=`<tr>${cells}</tr>`});
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - Répartition mensuelle</b></div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div><div class="scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
return;
}
if(curRub=="emploi"){
if(emplois[curCls]){
let e=emplois[curCls];let idx=0;
let head=`<tr><th>Horaires</th><th>DURÉE</th><th>LUNDI</th><th>MARDI</th><th>MERCREDI</th><th>JEUDI</th><th>VENDREDI</th></tr>`;
let rows=e.main.map(r=>{
let isSpecial=r[2]=="RECREATION"||r[3]=="RECREATION"||r[4]=="RECREATION"||r[2]=="INTER-CLASSE"||r[4]=="INTER-CLASSE";
let cells=r.map((c,j)=>{
let v=data[idx]!==undefined?data[idx]:c; idx++;
if(isSpecial&&c!="") return `<td colspan="1" style="background:#fff2cc;font-weight:bold"><input value="${v.replace(/"/g,'')}" style="text-align:center;font-weight:bold"></td>`;
return `<td><input value="${v.replace(/"/g,'')}"></td>`;
}).join("");
return `<tr>${cells}</tr>`;
}).join("");
let recapHead=`<tr><th>DISCIPLINES</th><th>HORAIRES OFFICIELLES</th><th>HORAIRES APPLIQUEES</th><th>ECART</th></tr>`;
let recapRows=e.recap.map(r=>{
let cells=r.map(c=>{let v=data[idx]!==undefined?data[idx]:c; idx++; return `<td><input value="${v.replace(/"/g,'')}"></td>`}).join("");
return `<tr>${cells}</tr>`;
}).join("");
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - ${e.titre}</b><br>Tableau modifiable - tes modifications sont enregistrées. PREMIERE ANNEE - ANNÉE SCOLAIRE : <input style="width:120px;display:inline-block" value=""></div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div><div class="scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div><h3>Tableau récapitulatif 1re année</h3><div class="scroll"><table class="recap"><thead>${recapHead}</thead><tbody>${recapRows}</tbody></table></div><p style="font-size:12px">Le/la Titulaire de la classe &nbsp;&nbsp; Le/la Directeur/trice de l’école &nbsp;&nbsp; Visa du Chef de Circonscription</p>`;
return;
}
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - 2. Emploi du temps</b><br>En attente de ton fichier pour ${curCls}.</div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div>`;
return;
}
let cfg={cahier:{cols:["Date","Matière","Objectif","Ce que je vais faire"],rows:5},liste:{cols:["N°","Nom","Prénom"],rows:30},plan:{cols:["Élève","Difficulté","Ce que je vais faire pour l'aider","Date"],rows:10}}[curRub];
let head=cfg.cols.map(c=>`<th>${c}</th>`).join("");let rows="";
for(let i=0;i<cfg.rows;i++){let cells="";for(let j=0;j<cfg.cols.length;j++){let v=data[i*cfg.cols.length+j]||"";if(curRub=="liste"&&j==0)v=i+1;cells+=`<td><input value="${v}" ${curRub=="liste"&&j==0?"readonly":""}></td>`}rows+=`<tr>${cells}</tr>`}
let titre=rubs.find(r=>r.id==curRub).t;
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - ${titre}</b><br>En attente de ton modèle vierge.</div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}
renderClasses();renderRubs();renderContent();
</script></body></html>
