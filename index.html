function renderClasses(){document.getElementById("classes").innerHTML=classes.map(c=>`<button class="btn cls ${c==curCls?"active":""}" onclick="setCls('${c}')">${c}</button>`).join("")}
function renderRubs(){document.getElementById("rubriques").innerHTML=`<h3>${curCls} - Choisis une rubrique :</h3>`+rubs.map(r=>`<button class="btn rub" onclick="setRub('${r.id}')">${r.t}</button>`).join("")}
function setRub(id){curRub=id;renderContent()}
function groupRow(idx,clsName,firstLabel){let cols=rep[curCls];let html=`<th>${firstLabel}</th>`;let i=0;while(i<cols.length){let j=i;while(j<cols.length&&cols[j][idx]==cols[i][idx])j++;let span=j-i;html+=`<th colspan="${span}" class="${clsName}">${cols[i][idx]}</th>`;i=j;}return `<tr>${html}</tr>`;}
function renderContent(){
let data=load();
if(curRub=="repartition"){
let cols=rep[curCls];let isSplit=curCls!="CP1"&&curCls!="CP2";
let head=groupRow(0,"champ","CHAMPS DISCIPLINAIRES")+`<tr><th>Disciplines / Mensualités</th>`+cols.map(c=>`<th class="disc">${c[1]}</th>`).join("")+`</tr>`;
let rows="";mois.forEach((m,i)=>{let cells=`<td class="mois">${m}</td>`;cols.forEach((c,j)=>{let v=data[i]&&data[i][j]?data[i][j]:"";if(isSplit&&c[1]=="Expression écrite")v="INITIATION A LA PRODUCTION ECRITE A PARTIR DES THEMES DE LA LECTURE ET DES STRUCTURES ETUDIEES EN EXPRESSION ORALE";if(isSplit&&(c[1]=="Vocabulaire"||c[1]=="Vocabulaire usuel"))v="EN RAPPORT AVEC LES THÈMES DE LECTURE";if(data[i]&&data[i][j])v=data[i][j];cells+=`<td><textarea rows="3">${v}</textarea></td>`;});rows+=`<tr>${cells}</tr>`});
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - Répartition mensuelle</b></div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div><div class="scroll"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;return;}
if(curRub=="emploi"){
if(emplois[curCls]){
let e=emplois[curCls];let idx=0;
let head=`<tr><th>Horaires</th><th>DURÉE</th><th>LUNDI</th><th>MARDI</th><th>MERCREDI</th><th>JEUDI</th><th>VENDREDI</th></tr>`;
let rows=e.main.map(r=>{let cells=r.map((c,j)=>{let v=data[idx]!==undefined?data[idx]:c;idx++;if(j>=2) return `<td><textarea rows="2">${v.replace(/"/g,'')}</textarea></td>`;return `<td><input value="${v.replace(/"/g,'')}"></td>`;}).join("");return `<tr>${cells}</tr>`;}).join("");
let recapHead=`<tr>${e.recapHead.map(h=>`<th>${h}</th>`).join("")}</tr>`;
let recapRows=e.recap.map(r=>{let cells=r.map(c=>{let v=data[idx]!==undefined?data[idx]:c;idx++;return `<td><input value="${v.replace(/"/g,'')}"></td>`}).join("");return `<tr>${cells}</tr>`;}).join("");
let num=curCls=="CP1"?"1re":curCls=="CP2"?"2e":curCls;
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - ${e.titre}</b><br>ANNÉE SCOLAIRE : <input style="width:120px;display:inline-block" value=""></div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div><div class="scroll emploi"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div><h3>Tableau récapitulatif ${num}</h3><div class="scroll"><table class="recap"><thead>${recapHead}</thead><tbody>${recapRows}</tbody></table></div><p style="font-size:12px">Le/la Titulaire de la classe &nbsp;&nbsp; Le/la Directeur/trice de l’école &nbsp;&nbsp; Visa du Chef de Circonscription</p>`;return;}
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - 2. Emploi du temps</b><br>En attente de ton fichier pour ${curCls}.</div>`;return;}
let cfg={cahier:{cols:["Date","Matière","Objectif","Ce que je vais faire"],rows:5},liste:{cols:["N°","Nom","Prénom"],rows:30},plan:{cols:["Élève","Difficulté","Ce que je vais faire pour l'aider","Date"],rows:10}}[curRub];
let head=cfg.cols.map(c=>`<th>${c}</th>`).join("");let rows="";for(let i=0;i<cfg.rows;i++){let cells="";for(let j=0;j<cfg.cols.length;j++){let v=data[i*cfg.cols.length+j]||"";if(curRub=="liste"&&j==0)v=i+1;cells+=`<td><input value="${v}" ${curRub=="liste"&&j==0?"readonly":""}></td>`}rows+=`<tr>${cells}</tr>`}
let titre=rubs.find(r=>r.id==curRub).t;
document.getElementById("content").innerHTML=`<div class="note"><b>${curCls} - ${titre}</b><br>En attente de ton modèle vierge.</div><div class="top no-print"><button class="btn save" onclick="save()">💾 Enregistrer</button><button class="btn print" onclick="window.print()">🖨️ Imprimer</button></div><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
}
renderClasses();renderRubs();renderContent();
</script></body></html>
