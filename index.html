function getEleves(classe){
try{let d=JSON.parse(localStorage.getItem("eprepa5_"+classe+"_liste")||"{}");let r=[];for(let i=0;i<80;i++){let n=(d["x"+i+"c1"]||"").trim().toUpperCase();if(n)r.push(n);}r.sort((a,b)=>a.localeCompare(b));if(r.length)return r;}catch(e){}return [];}
function calcMoyenne(notes,classe){
  const mats=MATIERES_RELEVE[classe]||[];
  let tot=0,max=0,nb=0;
  mats.forEach((m,i)=>{
    const v=parseFloat(notes[i]);
    if(!isNaN(v)){tot+=v;max+=m[1];nb++;}
  });
  if(!max) return "";
  return (tot/max*10).toFixed(2);
}
function appreciation(m){
  if(m==="") return "";
  m=parseFloat(m);
  if(m>=9) return "Très Bien";
  if(m>=7) return "Bien";
  if(m>=5) return "Assez Bien";
  if(m>=3) return "Passable";
  return "Insuffisant";
}
function releveKey(classe,tri){return "releve_"+classe+"_T"+tri;}
function getReleve(classe,tri){
  try{return JSON.parse(localStorage.getItem(releveKey(classe,tri))||"{}");}catch(e){return {};}
}
function saveReleve(classe,tri,idx,mat,val){
  const d=getReleve(classe,tri);
  if(!d[idx]) d[idx]={};
  d[idx][mat]=val;
  localStorage.setItem(releveKey(classe,tri),JSON.stringify(d));
  const mats=MATIERES_RELEVE[classe]||[];
  let tot=0,max=0;
  mats.forEach((m,i)=>{const v=parseFloat(d[idx][i]); if(!isNaN(v)){tot+=v;max+=m[1];}});
  const moy=max?(tot/max*10).toFixed(2):"";
  const el=document.getElementById("moy_"+idx);
  if(el) el.textContent=moy;
  const ap=document.getElementById("app_"+idx);
  if(ap) ap.textContent=appreciation(moy);
  updateRangsReleve(classe,tri);

function updateRangsReleve(classe,tri){

    mats.forEach((m,i)=>{const v=parseFloat(d[idx]&&d[idx][i]); if(!isNaN(v)){tot+=v;max+=m[1];}});
    return {idx,moy:max?(tot/max*10):-1};
  });

  });

function majRecap(){
let seuil={CP1:7,CP2:8,CE1:9,CE2:10,CM1:11,CM2:12}[curCls]||7;
let anneeRef=new Date().getFullYear();
let total=0,m=0,f=0,ages={},redoub={},prof={},rel={};
document.querySelectorAll("#content tbody tr").forEach(tr=>{
let nom=tr.querySelector('td:nth-child(2) input')?.value||"";
let sexe=tr.querySelector('td:nth-child(3) select')?.value||"";
let naiss=tr.querySelector('td:nth-child(4) input')?.value||"";
let profV=tr.querySelector('td:nth-child(7) select')?.value||"";
let relV=tr.querySelector('td:nth-child(8) select')?.value||"";

total++;if(sexe=="M")m++;if(sexe=="F")f++;
if(naiss){let age=anneeRef-parseInt(naiss.slice(0,4));let cle=age<seuil?"Moins de "+seuil+" ans":age+" ans";ages[cle]=(ages[cle]||0)+1;}
tr.querySelectorAll('td:nth-child(6) input[type=checkbox]').forEach(cb=>{if(cb.checked){let lab=cb.parentElement.textContent.trim();redoub[lab]=(redoub[lab]||0)+1;}});
if(profV)prof[profV]=(prof[profV]||0)+1;
if(relV)rel[relV]=(rel[relV]||0)+1;
});
let ageKeys=Object.keys(ages).sort((a,b)=>{if(a.startsWith("Moins"))return -1;if(b.startsWith("Moins"))return 1;return parseInt(a)-parseInt(b);});
let h=(titre,obj,keys)=>`<h3>${titre}</h3><table><tr><th>${titre}</th><th>Effectif</th></tr>${keys.map(k=>`<tr><td style="text-align:left">${k}</td><td>${obj[k]}</td></tr>`).join("")}</table>`;

}
